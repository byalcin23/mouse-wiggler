<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Mouse Wiggler: Tiny circles. Stay awake.</title>
  <desc id="description">A mint cursor and orbit logo on a dark background, with macOS, universal binary, and no dependencies badges.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#15252e"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="tile" x2="1" y2="1">
      <stop stop-color="#273e49"/>
      <stop offset="1" stop-color="#111d28"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#57e8c2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#57e8c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <circle cx="960" cy="166" r="270" fill="url(#glow)"/>
  <g fill="none" stroke="#57e8c2" stroke-opacity=".07">
    <circle cx="970" cy="170" r="143"/>
    <circle cx="970" cy="170" r="196"/>
    <circle cx="970" cy="170" r="248"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="64" y="64" fill="#57e8c2" font-size="13" font-weight="700" letter-spacing="3">MOUSE WIGGLER</text>
    <text x="60" y="137" fill="#f4f7f9" font-size="57" font-weight="700" letter-spacing="-2">Tiny circles. Stay awake.</text>
    <text x="64" y="183" fill="#a9b7c2" font-size="20">A little movement. A Mac that stays ready.</text>
    <g font-size="13" font-weight="600">
      <rect x="64" y="235" width="115" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="121.5" y="257" fill="#d4dfe5" text-anchor="middle">macOS 14+</text>
      <rect x="191" y="235" width="180" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="281" y="257" fill="#d4dfe5" text-anchor="middle">Apple Silicon + Intel</text>
      <rect x="383" y="235" width="151" height="34" rx="17" fill="#57e8c2" fill-opacity=".10" stroke="#57e8c2" stroke-opacity=".18"/>
      <text x="458.5" y="257" fill="#79edd0" text-anchor="middle">No dependencies</text>
    </g>
  </g>
  <g transform="translate(860 68)">
    <rect x="0" y="9" width="206" height="206" rx="46" fill="#000" fill-opacity=".2"/>
    <rect width="206" height="206" rx="46" fill="url(#tile)" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M 151 61 A 65 65 0 1 0 168 103" fill="none" stroke="#57e8c2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="166" cy="80" r="8" fill="#8af3dc"/>
    <path d="M 82 62 L 82 145 L 103 125 L 120 157 L 136 149 L 119 117 L 148 114 Z" fill="#f6fafc"/>
  </g>
</svg>
